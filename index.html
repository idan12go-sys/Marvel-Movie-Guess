<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0"

    >

    <title>Marvel Movie Guess</title>

    <style>

        * {

            box-sizing: border-box;

        }

        html,

        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

        }

        body {

            min-height: 100vh;

            font-family:

                Arial,

                Helvetica,

                sans-serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            /*

            ==================================================

            BACKGROUND

            ==================================================

            Change only this filename if you want

            another background image.

            Example:

            images/background.jpg

            ==================================================

            */

            background-image:

                linear-gradient(

                    rgba(0, 0, 0, 0.58),

                    rgba(0, 0, 0, 0.70)

                ),

                url("images/background.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }

        /*

        ======================================================

        MAIN GAME

        ======================================================

        */

        .game {

            width: min(950px, 94vw);

            padding: 35px 0;

            text-align: center;

        }

        /*

        ======================================================

        TITLE

        ======================================================

        */

        .title {

            margin-bottom: 7px;

            font-size:

                clamp(36px, 6vw, 68px);

            font-weight: 900;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:

                0 0 10px

                rgba(255, 0, 0, 0.85),

                0 0 30px

                rgba(255, 0, 0, 0.45);

        }

        .subtitle {

            margin-bottom: 30px;

            color: #ddd;

            font-size: 17px;

        }

        /*

        ======================================================

        IMAGE CONTAINER

        ======================================================

        */

        .image-container {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 18px;

            background: #050505;

            border:

                2px solid

                rgba(255, 255, 255, 0.14);

            box-shadow:

                0 25px 70px

                rgba(0, 0, 0, 0.82),

                0 0 45px

                rgba(255, 0, 0, 0.13);

        }

        #pixelCanvas {

            display: block;

            width: 100%;

            height: 100%;

        }

        /*
        ======================================================
        DIFFICULTY / IMAGE CLARITY INDICATOR
        ======================================================
        */

        .difficulty-status {

            margin-top: 12px;

            color: #ddd;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.4px;

        }

        .difficulty-status .level-number {

            color: #fff;

            font-weight: 800;

        }

        /*

        ======================================================

        SEARCH AREA

        ======================================================

        */

        .search-area {

            position: relative;

            margin-top: 25px;

            width: 100%;

        }

        /*

        ======================================================

        SEARCH BOX

        ======================================================

        */

        #answer {

            width: 100%;

            padding: 18px 20px;

            border-radius: 12px;

            border:

                2px solid

                rgba(255, 255, 255, 0.15);

            background:

                rgba(0, 0, 0, 0.78);

            color: white;

            font-size: 18px;

            outline: none;

            transition:

                border-color 0.2s,

                box-shadow 0.2s;

        }

        #answer::placeholder {

            color: #aaa;

        }

        #answer:focus {

            border-color: #e62429;

            box-shadow:

                0 0 20px

                rgba(230, 36, 41, 0.32);

        }

        /*

        ======================================================

        DROPDOWN

        ======================================================

        */

        .dropdown {

            position: absolute;

            top: calc(100% + 5px);

            left: 0;

            right: 0;

            z-index: 100;

            display: none;

            max-height: 320px;

            overflow-y: auto;

            background:

                rgba(13, 13, 13, 0.98);

            border:

                1px solid

                rgba(255, 255, 255, 0.14);

            border-radius: 11px;

            box-shadow:

                0 18px 45px

                rgba(0, 0, 0, 0.75);

        }

        .dropdown-item {

            padding:

                14px 18px;

            text-align: left;

            font-size: 16px;

            cursor: pointer;

            border-bottom:

                1px solid

                rgba(255, 255, 255, 0.06);

            transition:

                background 0.15s;

        }

        .dropdown-item:last-child {

            border-bottom: none;

        }

        .dropdown-item:hover,

        .dropdown-item.selected {

            background:

                rgba(230, 36, 41, 0.82);

        }

        /*

        ======================================================

        BUTTONS

        ======================================================

        */

        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 12px;

        }

        button {

            flex: 1;

            padding: 16px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #e62429;

            transition:

                transform 0.15s,

                filter 0.15s,

                opacity 0.15s;

        }

        button:hover:not(:disabled) {

            filter: brightness(1.16);

            transform:

                translateY(-2px);

        }

        button:active:not(:disabled) {

            transform:

                translateY(0);

        }

        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }

        .hint-button {

            background: #333;

        }

        /*

        ======================================================

        RESULT

        ======================================================

        */

        .result {

            min-height: 30px;

            margin-top: 16px;

            font-size: 19px;

            font-weight: bold;

        }

        .correct {

            color: #4cff78;

        }

        .wrong {

            color: #ff5252;

        }

        .hint {

            color: #ffc107;

        }

        /*

        ======================================================

        INFO

        ======================================================

        */

        .info {

            margin-top: 15px;

            color: #aaa;

            font-size: 13px;

        }

        /*

        ======================================================

        MOBILE

        ======================================================

        */

        @media (max-width: 600px) {

            .game {

                width: 94vw;

                padding:

                    20px 0;

            }

            .buttons {

                flex-direction: column;

            }

            .title {

                letter-spacing: 2px;

            }

        }

    
        /* GITHUB IMAGE REPORT SYSTEM - BEGIN */
        #communityReportControls {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 10000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: calc(100vw - 28px);
        }
        .community-report-button {
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 10px;
            padding: 10px 13px;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .4px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(0,0,0,.45);
            flex: 0 0 auto;
        }
        #reportCurrentImageButton { background: #a91f27; }
        #openReportedImagesButton { background: #292929; }
        .community-report-button:hover { filter: brightness(1.18); }
        #reportedImageBadge {
            position: absolute;
            top: 13px;
            left: 13px;
            z-index: 5;
            display: none;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 8px;
            background: rgba(174, 28, 35, .95);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .5px;
            box-shadow: 0 4px 16px rgba(0,0,0,.5);
            pointer-events: none;
        }
        #reportedImagesModal {
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: none;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 28px 14px;
            background: rgba(0,0,0,.88);
            backdrop-filter: blur(7px);
        }
        #reportedImagesPanel {
            width: min(1100px, 100%);
            min-height: 240px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 16px;
            background: #111;
            box-shadow: 0 25px 90px rgba(0,0,0,.7);
            text-align: left;
        }
        #reportedImagesHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }
        #reportedImagesTitle {
            margin: 0;
            color: #fff;
            font-size: clamp(22px, 4vw, 32px);
        }
        #closeReportedImagesButton {
            flex: 0 0 auto;
            width: auto;
            padding: 9px 15px;
            background: #333;
        }
        #reportedImagesStatus {
            margin: 0 0 18px;
            color: #bbb;
            font-size: 14px;
            line-height: 1.5;
        }
        #reportedImagesGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(245px, 100%), 1fr));
            gap: 16px;
        }
        .reported-image-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 12px;
            background: #1b1b1b;
        }
        .reported-image-card img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #050505;
        }
        .reported-image-card-info { padding: 11px 12px 13px; }
        .reported-image-movie {
            margin: 0 0 5px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
        }
        .reported-image-filename {
            margin: 0 0 9px;
            color: #bbb;
            font-size: 12px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
        .reported-image-link {
            color: #ff777b;
            font-size: 12px;
            text-decoration: none;
        }
        .reported-image-link:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            #communityReportControls { top: 8px; left: 8px; gap: 6px; }
            .community-report-button { padding: 9px 10px; font-size: 10px; }
            #reportedImagesPanel { padding: 15px; }
            #reportedImagesModal { padding: 12px 8px; }
        }
        /* GITHUB IMAGE REPORT SYSTEM - END */
</style>

</head>

<body>

<div class="game">

    <div class="title">

        Marvel Movie Guess

    </div>

    <div class="subtitle">

        Can you recognize the movie?

    </div>

    <div class="image-container">

        <canvas

            id="pixelCanvas"

        ></canvas>

    </div>

    <div class="difficulty-status" aria-live="polite">
        Image clarity: Level
        <span id="clarityLevel" class="level-number">1</span>
        /
        <span id="clarityTotal" class="level-number">7</span>
    </div>

    <div class="search-area">

        <input

            id="answer"

            type="text"

            placeholder="Search for a Marvel movie..."

            autocomplete="off"

        >

        <div

            id="dropdown"

            class="dropdown"

        ></div>

    </div>

    <div class="buttons">

        <button

            id="guessButton"

            type="button"

        >

            GUESS

        </button>

        <button

            id="hintButton"

            class="hint-button"

            type="button"

        >

            HINT

        </button>

    </div>

    <div

        id="result"

        class="result"

    ></div>

    <div class="info">

        Search for a movie and select it from the list.

    </div>

</div>

/*

=================================================================

GAME VARIABLES

=================================================================

*/

let currentMovie = null;

let currentImage = null;

let usedMovies = [];

let selectedMovie = null;

let selectedIndex = -1;

let hintUsed = false;

let answerLocked = false;

let revealProgress = 0;

// Seven image-clarity levels: each number is the pixel block size.
// Larger blocks are harder; smaller blocks reveal more detail.
const pixelationLevels = [30, 24, 18, 13, 8, 4, 1];

// Increase clarity after every two incorrect movie guesses.
const WRONG_GUESSES_PER_LEVEL = 2;

let wrongGuessCount = 0;

// Images and movies that fail to load are skipped for this page session.
const brokenImages = new Set();
const brokenMovies = new Set();

// Each movie gets a shuffled image deck. An image is not reused for that
// movie until every other working image in its deck has been shown once.
const movieImageBags = new Map();
const lastImageByMovie = new Map();

let imageLoadGeneration = 0;
let nextMovieTimer = null;
let revealFrameId = null;

/*

Movies that the user already guessed incorrectly

during the CURRENT round.

*/

let eliminatedMovies = new Set();

/*

=================================================================

ELEMENTS

=================================================================

*/

const canvas =

    document.getElementById(

        "pixelCanvas"

    );

const ctx =

    canvas.getContext("2d");

const answerInput =

    document.getElementById(

        "answer"

    );

const dropdown =

    document.getElementById(

        "dropdown"

    );

const result =

    document.getElementById(

        "result"

    );

const guessButton =

    document.getElementById(

        "guessButton"

    );

const hintButton =

    document.getElementById(

        "hintButton"

    );


const clarityLevelElement =

    document.getElementById(

        "clarityLevel"

    );

const clarityTotalElement =

    document.getElementById(

        "clarityTotal"

    );


function getPixelationLevelIndex() {

    return Math.min(

        Math.floor(

            wrongGuessCount / WRONG_GUESSES_PER_LEVEL

        ),

        pixelationLevels.length - 1

    );

}


function updateDifficultyDisplay() {

    const levelIndex = getPixelationLevelIndex();

    clarityLevelElement.textContent =

        String(levelIndex + 1);

    clarityTotalElement.textContent =

        String(pixelationLevels.length);

    if (currentImage && currentImage.complete && currentImage.naturalWidth > 0) {

        drawPixelatedImage();

    }

}

/*

=================================================================

CANVAS

=================================================================

*/

function resizeCanvas() {

    const rect =

        canvas.getBoundingClientRect();

    const dpr =

        window.devicePixelRatio || 1;

    canvas.width =

        Math.max(

            1,

            Math.round(

                rect.width * dpr

            )

        );

    canvas.height =

        Math.max(

            1,

            Math.round(

                rect.height * dpr

            )

        );

    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );

    if (

        currentImage

        &&

        currentImage.complete

    ) {

        drawPixelatedImage();

    }

}

window.addEventListener(

    "resize",

    resizeCanvas

);

/*

=================================================================

LOAD RANDOM MOVIE

=================================================================

*/

function shuffleArray(items) {
    const shuffled = [...items];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}


function prepareMovieImageBag(movie) {
    // Keep any unused images already waiting in this movie's deck.
    let bag = movieImageBags.get(movie) || [];
    bag = bag.filter(imagePath => !brokenImages.has(imagePath));

    // When the deck is empty, start a new shuffled cycle using only
    // unique, working filenames from this movie.
    if (bag.length === 0) {
        const validImages = [...new Set(
            (Array.isArray(movie.images) ? movie.images : [])
                .filter(imagePath =>
                    typeof imagePath === 'string' &&
                    imagePath.trim() !== '' &&
                    !brokenImages.has(imagePath)
                )
        )];

        bag = shuffleArray(validImages);

        // Avoid showing the same image at the boundary between two cycles
        // whenever this movie has more than one working image.
        const previousImage = lastImageByMovie.get(movie);
        if (bag.length > 1 && bag[bag.length - 1] === previousImage) {
            const swapIndex = Math.floor(Math.random() * (bag.length - 1));
            [bag[bag.length - 1], bag[swapIndex]] =
                [bag[swapIndex], bag[bag.length - 1]];
        }
    }

    movieImageBags.set(movie, bag);
}


function loadRandomMovie() {
    // Invalidate callbacks and animations belonging to an older round.
    imageLoadGeneration++;
    const generation = imageLoadGeneration;

    if (nextMovieTimer !== null) {
        clearTimeout(nextMovieTimer);
        nextMovieTimer = null;
    }

    if (revealFrameId !== null) {
        cancelAnimationFrame(revealFrameId);
        revealFrameId = null;
    }

    // Reset the round.
    eliminatedMovies.clear();
    currentMovie = null;
    currentImage = null;
    revealProgress = 0;
    wrongGuessCount = 0;
    selectedMovie = null;
    selectedIndex = -1;
    hintUsed = false;
    answerLocked = false;

    answerInput.value = '';
    answerInput.disabled = true;
    guessButton.disabled = true;
    hintButton.disabled = true;

    result.textContent = 'Loading image...';
    result.className = 'result';
    updateDifficultyDisplay();
    hideDropdown();
    clearGameCanvas();

    // Avoid repeating a movie until every playable movie has appeared.
    let availableMovies = movies.filter(movie =>
        !usedMovies.includes(movie) && !brokenMovies.has(movie)
    );

    // Start a new movie cycle when all remaining playable movies were used.
    if (availableMovies.length === 0) {
        const playableMovies = movies.filter(movie => !brokenMovies.has(movie));

        if (playableMovies.length === 0) {
            result.textContent =
                'No working movie images were found. Check the images folder and filenames.';
            result.className = 'result wrong';
            answerInput.disabled = true;
            guessButton.disabled = true;
            hintButton.disabled = true;
            return;
        }

        usedMovies = [];
        availableMovies = playableMovies;
    }

    const randomIndex = Math.floor(Math.random() * availableMovies.length);
    currentMovie = availableMovies[randomIndex];
    usedMovies.push(currentMovie);

    // Set up this movie's no-repeat image deck, then load from it.
    prepareMovieImageBag(currentMovie);
    loadWorkingImageForMovie(currentMovie, generation);
}


function clearGameCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    if (canvas.width !== Math.max(1, Math.round(rect.width * dpr)) ||
        canvas.height !== Math.max(1, Math.round(rect.height * dpr))) {
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
}


function loadWorkingImageForMovie(movie, generation) {
    // Ignore delayed callbacks belonging to an older round.
    if (generation !== imageLoadGeneration || movie !== currentMovie) {
        return;
    }

    const bag = movieImageBags.get(movie) || [];

    // If every remaining image in this deck failed, mark this movie unusable.
    if (bag.length === 0) {
        brokenMovies.add(movie);
        movieImageBags.set(movie, []);

        console.warn(
            'Skipping movie; every image failed to load:',
            movie.title
        );

        result.textContent = `Skipping ${movie.title}: no working images.`;
        result.className = 'result hint';

        // Schedule the next movie without deep recursion.
        setTimeout(() => {
            if (generation === imageLoadGeneration && movie === currentMovie) {
                loadRandomMovie();
            }
        }, 0);

        return;
    }

    // Consume the next image from this movie's shuffled deck.
    // It will not be selected again until this movie's deck is exhausted.
    const imagePath = bag.pop();
    movieImageBags.set(movie, bag);

    const testImage = new Image();

    testImage.onload = function () {
        if (generation !== imageLoadGeneration || movie !== currentMovie) {
            return;
        }

        if (!testImage.naturalWidth || !testImage.naturalHeight) {
            brokenImages.add(imagePath);
            loadWorkingImageForMovie(movie, generation);
            return;
        }

        currentImage = testImage;
        lastImageByMovie.set(movie, imagePath);
        if (window.updateReportedImageBadge) { window.updateReportedImageBadge(imagePath); }
        revealProgress = 0;

        resizeCanvas();
        drawPixelatedImage();

        result.textContent = '';
        result.className = 'result';

        answerInput.disabled = false;
        guessButton.disabled = false;
        hintButton.disabled = false;
        answerInput.focus();

        console.info('Loaded image:', imagePath);
    };

    testImage.onerror = function () {
        if (generation !== imageLoadGeneration || movie !== currentMovie) {
            return;
        }

        // Remember the failed filename and continue with the next unused image.
        brokenImages.add(imagePath);
        console.warn('Skipping unavailable image:', imagePath);
        loadWorkingImageForMovie(movie, generation);
    };

    // Do not change the path: it is exactly as listed in movies[].images.
    testImage.src = imagePath;
}


function drawPixelatedImage() {

    if (

        !currentImage

        ||

        !currentImage.complete

        ||

        currentImage.naturalWidth === 0

    ) {

        return;

    }

    const rect =

        canvas.getBoundingClientRect();

    const width =

        Math.max(

            1,

            rect.width

        );

    const height =

        Math.max(

            1,

            rect.height

        );

    ctx.clearRect(

        0,

        0,

        width,

        height

    );

    /*

    Keep 16:9 crop.

    */

    const imageRatio =

        currentImage.width /

        currentImage.height;

    const canvasRatio =

        width /

        height;

    let sourceX = 0;

    let sourceY = 0;

    let sourceWidth =

        currentImage.width;

    let sourceHeight =

        currentImage.height;

    if (

        imageRatio > canvasRatio

    ) {

        sourceWidth =

            currentImage.height *

            canvasRatio;

        sourceX =

            (

                currentImage.width -

                sourceWidth

            ) / 2;

    }

    else {

        sourceHeight =

            currentImage.width /

            canvasRatio;

        sourceY =

            (

                currentImage.height -

                sourceHeight

            ) / 2;

    }

    /*

    Pixel size is controlled by the current difficulty level.
    More wrong guesses = smaller pixel blocks = higher resolution.
    On a correct answer, revealProgress animates the image to full clarity.

    */

    const levelIndex = getPixelationLevelIndex();

    const startPixelSize = pixelationLevels[levelIndex];

    const pixelSize = Math.max(

        1,

        Math.round(

            startPixelSize -

            (startPixelSize - 1) * revealProgress

        )

    );

    /*

    Create low resolution canvas.

    */

    const smallWidth =

        Math.max(

            1,

            Math.ceil(

                width /

                pixelSize

            )

        );

    const smallHeight =

        Math.max(

            1,

            Math.ceil(

                height /

                pixelSize

            )

        );

    const smallCanvas =

        document.createElement(

            "canvas"

        );

    smallCanvas.width =

        smallWidth;

    smallCanvas.height =

        smallHeight;

    const smallCtx =

        smallCanvas.getContext(

            "2d"

        );

    /*

    No smoothing.

    */

    smallCtx.imageSmoothingEnabled =

        false;

    ctx.imageSmoothingEnabled =

        false;

    /*

    Draw image into low-res canvas.

    */

    smallCtx.drawImage(

        currentImage,

        sourceX,

        sourceY,

        sourceWidth,

        sourceHeight,

        0,

        0,

        smallWidth,

        smallHeight

    );

    /*

    Scale it back up.

    */

    ctx.drawImage(

        smallCanvas,

        0,

        0,

        smallWidth,

        smallHeight,

        0,

        0,

        width,

        height

    );

}

/*

=================================================================

REVEAL IMAGE

=================================================================

*/

function revealImage() {
    const duration = 1100;
    const startTime = performance.now();
    const generation = imageLoadGeneration;

    function animate(currentTime) {
        if (generation !== imageLoadGeneration) {
            revealFrameId = null;
            return;
        }

        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);

        revealProgress = eased;
        drawPixelatedImage();

        if (progress < 1) {
            revealFrameId = requestAnimationFrame(animate);
        } else {
            revealProgress = 1;
            revealFrameId = null;
            drawPixelatedImage();
        }
    }

    revealFrameId = requestAnimationFrame(animate);
}


answerInput.addEventListener(

    "input",

    function() {

        selectedMovie = null;

        selectedIndex = -1;

        showSuggestions();

    }

);

/*

=================================================================

FOCUS INPUT

=================================================================

*/

answerInput.addEventListener(

    "focus",

    function() {

        showSuggestions();

    }

);

/*

=================================================================

SHOW SUGGESTIONS

=================================================================

*/

function showSuggestions() {

    const searchText =

        answerInput.value

            .toLowerCase()

            .trim();

    /*

    IMPORTANT:

    Filter out movies that have already

    been guessed incorrectly.

    */

    const availableForSearch = movies.filter(movie =>
        !eliminatedMovies.has(movie) &&
        !brokenMovies.has(movie)
    );

    let matches;

    if (

        searchText === ""

    ) {

        matches =

            availableForSearch.slice(

                0,

                30

            );

    }

    else {

        matches =

            availableForSearch

                .filter(

                    movie =>

                        movie.title

                            .toLowerCase()

                            .includes(

                                searchText

                            )

                )

                .slice(

                    0,

                    30

                );

    }

    dropdown.innerHTML =

        "";

    /*

    No results.

    */

    if (

        matches.length === 0

    ) {

        const item =

            document.createElement(

                "div"

            );

        item.className =

            "dropdown-item";

        item.textContent =

            "No movies found";

        item.style.cursor =

            "default";

        dropdown.appendChild(

            item

        );

        dropdown.style.display =

            "block";

        return;

    }

    /*

    Create each option.

    */

    matches.forEach(

        movie => {

            const item =

                document.createElement(

                    "div"

                );

            item.className =

                "dropdown-item";

            item.textContent =

                movie.title;

            item.dataset.movieTitle =

                movie.title;

            item.addEventListener(

                "click",

                function() {

                    selectMovie(

                        movie

                    );

                }

            );

            dropdown.appendChild(

                item

            );

        }

    );

    dropdown.style.display =

        "block";

}

/*

=================================================================

SELECT MOVIE

=================================================================

*/

function selectMovie(

    movie

) {

    /*

    Do not allow eliminated movies

    to be selected.

    */

    if (

        eliminatedMovies.has(movie) ||
        brokenMovies.has(movie)

    ) {

        return;

    }

    selectedMovie =

        movie;

    answerInput.value =

        movie.title;

    selectedIndex = -1;

    hideDropdown();

    answerInput.focus();

}

/*

=================================================================

HIDE DROPDOWN

=================================================================

*/

function hideDropdown() {

    dropdown.style.display =

        "none";

}

/*

=================================================================

KEYBOARD NAVIGATION

=================================================================

*/

answerInput.addEventListener(

    "keydown",

    function(event) {

        const items =

            dropdown.querySelectorAll(

                ".dropdown-item"

            );

        /*

        DOWN

        */

        if (

            event.key ===

            "ArrowDown"

        ) {

            event.preventDefault();

            if (

                items.length === 0

            ) {

                return;

            }

            selectedIndex++;

            if (

                selectedIndex >=

                items.length

            ) {

                selectedIndex = 0;

            }

            updateSelectedItem(

                items

            );

        }

        /*

        UP

        */

        else if (

            event.key ===

            "ArrowUp"

        ) {

            event.preventDefault();

            if (

                items.length === 0

            ) {

                return;

            }

            selectedIndex--;

            if (

                selectedIndex < 0

            ) {

                selectedIndex =

                    items.length - 1;

            }

            updateSelectedItem(

                items

            );

        }

        /*

        ENTER

        */

        else if (

            event.key ===

            "Enter"

        ) {

            event.preventDefault();

            if (

                selectedIndex >= 0

                &&

                items[

                    selectedIndex

                ]

            ) {

                items[

                    selectedIndex

                ].click();

            }

            else {

                checkAnswer();

            }

        }

        /*

        ESCAPE

        */

        else if (

            event.key ===

            "Escape"

        ) {

            hideDropdown();

        }

    }

);

/*

=================================================================

KEYBOARD SELECTION

=================================================================

*/

function updateSelectedItem(

    items

) {

    items.forEach(

        item => {

            item.classList.remove(

                "selected"

            );

        }

    );

    if (

        items[selectedIndex]

    ) {

        items[

            selectedIndex

        ].classList.add(

            "selected"

        );

        items[

            selectedIndex

        ].scrollIntoView({

            block: "nearest"

        });

    }

}

/*

=================================================================

CLICK OUTSIDE

=================================================================

*/

document.addEventListener(

    "click",

    function(event) {

        if (

            !event.target.closest(

                ".search-area"

            )

        ) {

            hideDropdown();

        }

    }

);

/*

=================================================================

NORMALIZE

=================================================================

*/

function normalize(

    text

) {

    return text

        .toLowerCase()

        .replace(

            /[^a-z0-9א-ת]/g,

            ""

        )

        .trim();

}

/*

=================================================================

CHECK ANSWER

=================================================================

*/

function checkAnswer() {

    // Wait until a valid image has loaded before accepting a guess.
    if (answerInput.disabled || !currentImage) {
        return;
    }

    if (answerLocked) {

        return;

    }

    let guessedMovie =

        selectedMovie;

    /*

    If the user didn't choose an item

    from the dropdown, try exact text.

    */

    if (

        !guessedMovie

    ) {

        const typedAnswer =

            normalize(

                answerInput.value

            );

        guessedMovie =

            movies.find(

                movie =>

                    !eliminatedMovies.has(movie) &&
                    !brokenMovies.has(movie) &&

                    normalize(

                        movie.title

                    )

                    ===

                    typedAnswer

            );

    }

    /*

    No valid movie.

    */

    if (

        !guessedMovie

    ) {

        result.textContent =

            "Choose a movie from the list.";

        result.className =

            "result wrong";

        showSuggestions();

        return;

    }

    /*

    =============================================================

    CORRECT

    =============================================================

    */

    if (

        guessedMovie ===

        currentMovie

    ) {

        answerLocked =

            true;

        result.textContent =

            "Correct! 🎉";

        result.className =

            "result correct";

        guessButton.disabled =

            true;

        hintButton.disabled =

            true;

        hideDropdown();

        /*

        Reveal image.

        */

        revealImage();

        /*

        Wait, then load another movie.

        */

        nextMovieTimer = setTimeout(function() {
            nextMovieTimer = null;
            loadRandomMovie();
        }, 3000);

        return;

    }

    /*

    =============================================================

    WRONG

    =============================================================

    */

    /*

    Add the incorrect movie

    to the eliminated set.

    */

    eliminatedMovies.add(

        guessedMovie

    );

    // Count this incorrect guess and raise the image clarity every two mistakes.
    wrongGuessCount++;

    const previousLevel = getPixelationLevelIndex();

    updateDifficultyDisplay();

    const newLevel = getPixelationLevelIndex();

    /*

    Clear selected movie.

    */

    selectedMovie =

        null;

    selectedIndex =

        -1;

    /*

    Clear input.

    */

    answerInput.value =

        "";

    /*

    Show wrong message.

    */

    if (newLevel > previousLevel) {

        result.textContent =

            `"${guessedMovie.title}" is not correct. Image clarity increased to Level ${newLevel + 1}/${pixelationLevels.length}.`;

    } else {

        const guessesUntilNextLevel =

            WRONG_GUESSES_PER_LEVEL -

            (wrongGuessCount % WRONG_GUESSES_PER_LEVEL);

        result.textContent =

            `"${guessedMovie.title}" is not correct. ${guessesUntilNextLevel} more wrong guess${guessesUntilNextLevel === 1 ? "" : "es"} to increase image clarity.`;

    }

    result.className =

        "result wrong";

    /*

    IMPORTANT:

    Rebuild dropdown immediately.

    The wrong movie will now be gone

    from every search result until

    the next round.

    */

    showSuggestions();

    /*

    Focus search again.

    */

    answerInput.focus();

}

/*

=================================================================

HINT

=================================================================

*/

function useHint() {

    if (

        answerLocked

    ) {

        return;

    }

    if (

        hintUsed

    ) {

        result.textContent =

            "You already used the hint.";

        result.className =

            "result hint";

        return;

    }

    hintUsed =

        true;

    const firstLetter =

        currentMovie.title.charAt(

            0

        );

    result.textContent =

        `Hint: The movie starts with "${firstLetter}".`;

    result.className =

        "result hint";

}

/*

=================================================================

BUTTON EVENTS

=================================================================

*/

guessButton.addEventListener(

    "click",

    function() {

        checkAnswer();

    }

);

hintButton.addEventListener(

    "click",

    function() {

        useHint();

    }

);

/*

=================================================================

START

=================================================================

*/

resizeCanvas();

updateDifficultyDisplay();

loadRandomMovie();


/* ================================================================
   GITHUB IMAGE REPORT SYSTEM - BEGIN
   Uses only this public GitHub repository's Issues API.
   Reporting does not skip the current image; the player must still
   guess correctly before the game advances.
   ================================================================ */
(function installGitHubImageReports() {
    'use strict';

    const REPORTS_OWNER = "idan12go-sys";
    const REPORTS_REPO = "Marvel-Movie-Guess";
    const REPORT_TITLE_PREFIX = '[IMAGE REPORT]';
    const API_BASE = `https://api.github.com/repos/${encodeURIComponent(REPORTS_OWNER)}/${encodeURIComponent(REPORTS_REPO)}/issues`;

    let cachedReports = [];
    let reportedImagePaths = new Set();
    let lastFetchTime = 0;
    let fetchPromise = null;

    const controls = document.createElement('div');
    controls.id = 'communityReportControls';

    const reportButton = document.createElement('button');
    reportButton.type = 'button';
    reportButton.id = 'reportCurrentImageButton';
    reportButton.className = 'community-report-button';
    reportButton.textContent = 'REPORT IMAGE';
    reportButton.title = 'Open a pre-filled GitHub issue for the current image';

    const galleryButton = document.createElement('button');
    galleryButton.type = 'button';
    galleryButton.id = 'openReportedImagesButton';
    galleryButton.className = 'community-report-button';
    galleryButton.textContent = 'REPORTED IMAGES';
    galleryButton.title = 'View images reported by visitors';

    controls.append(reportButton, galleryButton);
    document.body.appendChild(controls);

    const imageContainer = document.querySelector('.image-container');
    const badge = document.createElement('div');
    badge.id = 'reportedImageBadge';
    badge.textContent = 'IMAGE REPORTED';
    if (imageContainer) imageContainer.appendChild(badge);

    const modal = document.createElement('div');
    modal.id = 'reportedImagesModal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'reportedImagesTitle');

    const panel = document.createElement('div');
    panel.id = 'reportedImagesPanel';

    const header = document.createElement('div');
    header.id = 'reportedImagesHeader';

    const heading = document.createElement('h2');
    heading.id = 'reportedImagesTitle';
    heading.textContent = 'Reported Images';

    const closeButton = document.createElement('button');
    closeButton.type = 'button';
    closeButton.id = 'closeReportedImagesButton';
    closeButton.textContent = 'CLOSE';
    closeButton.addEventListener('click', closeGallery);

    header.append(heading, closeButton);

    const status = document.createElement('p');
    status.id = 'reportedImagesStatus';
    status.textContent = 'Loading reports from GitHub...';

    const grid = document.createElement('div');
    grid.id = 'reportedImagesGrid';

    panel.append(header, status, grid);
    modal.appendChild(panel);
    document.body.appendChild(modal);

    function getCurrentImagePath() {
        if (!currentMovie) return '';
        return lastImageByMovie.get(currentMovie) || '';
    }

    function parseIssue(issue) {
        if (!issue || issue.pull_request || !/^\[IMAGE REPORT\]/i.test(issue.title || '')) {
            return null;
        }

        const body = String(issue.body || '');
        const movieMatch = body.match(/^Movie:\s*(.+)$/im);
        const imageMatch = body.match(/^Image:\s*(.+)$/im);
        if (!imageMatch) return null;

        const imagePath = imageMatch[1].trim();
        // Only accept a local image inside this site's images folder.
        if (!/^images\/[^\r\n]+$/i.test(imagePath) || imagePath.includes('..')) {
            return null;
        }

        return {
            movie: movieMatch ? movieMatch[1].trim() : 'Unknown movie',
            imagePath,
            issueUrl: issue.html_url || `https://github.com/${REPORTS_OWNER}/${REPORTS_REPO}/issues/${issue.number}`,
            state: issue.state || 'open',
            createdAt: issue.created_at || ''
        };
    }

    async function fetchReports(forceRefresh) {
        const now = Date.now();
        if (!forceRefresh && now - lastFetchTime < 60000 && cachedReports.length >= 0) {
            return cachedReports;
        }
        if (fetchPromise) return fetchPromise;

        fetchPromise = (async () => {
            const found = [];
            const seenPaths = new Set();

            for (let page = 1; page <= 10; page++) {
                const url = `${API_BASE}?state=all&per_page=100&page=${page}&sort=created&direction=desc`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    cache: 'no-store'
                });

                if (!response.ok) {
                    let detail = `GitHub returned HTTP ${response.status}.`;
                    try {
                        const errorData = await response.json();
                        if (errorData && errorData.message) detail += ` ${errorData.message}`;
                    } catch (_) {}
                    throw new Error(detail);
                }

                const issues = await response.json();
                if (!Array.isArray(issues)) throw new Error('GitHub returned an unexpected response.');

                for (const issue of issues) {
                    const report = parseIssue(issue);
                    if (!report || seenPaths.has(report.imagePath)) continue;
                    seenPaths.add(report.imagePath);
                    found.push(report);
                }

                if (issues.length < 100) break;
            }

            cachedReports = found;
            reportedImagePaths = new Set(found.map(report => report.imagePath));
            lastFetchTime = Date.now();
            const activePath = getCurrentImagePath();
            if (activePath) updateReportedImageBadge(activePath);
            return cachedReports;
        })();

        try {
            return await fetchPromise;
        } finally {
            fetchPromise = null;
        }
    }

    function updateReportedImageBadge(imagePath) {
        if (!badge) return;
        badge.style.display = imagePath && reportedImagePaths.has(imagePath) ? 'block' : 'none';
    }

    // Called by the existing game's image-load function after a frame loads.
    window.updateReportedImageBadge = updateReportedImageBadge;

    reportButton.addEventListener('click', function () {
        const movieTitle = currentMovie ? currentMovie.title : '';
        const imagePath = getCurrentImagePath();

        if (!movieTitle || !imagePath || !currentImage || !currentImage.complete) {
            window.alert('Please wait until the current image has loaded.');
            return;
        }

        const fileName = imagePath.split('/').pop();
        const title = `${REPORT_TITLE_PREFIX} ${fileName}`;
        const body = [
            'Please review this image in Marvel Movie Guess.',
            '',
            `Movie: ${movieTitle}`,
            `Image: ${imagePath}`,
            `Page: ${window.location.href}`,
            '',
            'Reason: The image may be black, show subtitles/text, be obstructed, or otherwise be unsuitable.'
        ].join('\n');

        const query = new URLSearchParams({ title, body });
        const issueUrl = `https://github.com/${encodeURIComponent(REPORTS_OWNER)}/${encodeURIComponent(REPORTS_REPO)}/issues/new?${query.toString()}`;

        // Deliberately do NOT call loadRandomMovie(). Solving the puzzle is
        // still the only way to advance to the next image.
        const opened = window.open(issueUrl, '_blank');
        if (!opened) {
            window.alert('Your browser blocked the GitHub tab. Please allow pop-ups for this site and try again.');
            return;
        }
        opened.opener = null;
    });

    function clearGrid() {
        while (grid.firstChild) grid.removeChild(grid.firstChild);
    }

    function renderGallery(reports) {
        clearGrid();
        status.textContent = reports.length
            ? `${reports.length} reported image${reports.length === 1 ? '' : 's'} found in this GitHub repository.`
            : 'There are no reported images yet.';

        for (const report of reports) {
            const card = document.createElement('article');
            card.className = 'reported-image-card';

            const image = document.createElement('img');
            image.src = report.imagePath;
            image.alt = report.imagePath.split('/').pop();
            image.loading = 'lazy';
            image.onerror = function () {
                image.alt = 'Image file is missing from the website';
                image.removeAttribute('src');
            };

            const info = document.createElement('div');
            info.className = 'reported-image-card-info';

            const movie = document.createElement('p');
            movie.className = 'reported-image-movie';
            movie.textContent = report.movie;

            const filename = document.createElement('p');
            filename.className = 'reported-image-filename';
            filename.textContent = report.imagePath.split('/').pop();

            const link = document.createElement('a');
            link.className = 'reported-image-link';
            link.href = report.issueUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = 'View GitHub report';

            info.append(movie, filename, link);
            card.append(image, info);
            grid.appendChild(card);
        }
    }

    async function openGallery() {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        status.textContent = 'Loading reports from GitHub...';
        clearGrid();

        try {
            const reports = await fetchReports(true);
            renderGallery(reports);
        } catch (error) {
            status.textContent = `Could not load GitHub reports: ${error.message}`;
        }
    }

    function closeGallery() {
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }

    galleryButton.addEventListener('click', openGallery);
    modal.addEventListener('click', function (event) {
        if (event.target === modal) closeGallery();
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && modal.style.display === 'flex') closeGallery();
    });

    // Fetch once so reported images are labelled during normal gameplay.
    fetchReports(false).catch(error => {
        console.warn('Could not load community image reports from GitHub:', error);
    });
})();
/* GITHUB IMAGE REPORT SYSTEM - END */
</script>
